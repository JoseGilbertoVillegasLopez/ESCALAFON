# =====================================================
# CONFIGURACIÓN GLOBAL DE SERVICIOS Y PARÁMETROS
# =====================================================

# -------------------------------
# 🔧 Parámetros globales
# -------------------------------
parameters:
  # Parámetros usados por los servicios de correo
  app.mail.from_email: '%env(APP_MAIL_FROM_EMAIL)%'
  app.mail.from_name:  '%env(APP_MAIL_FROM_NAME)%'
  app.mail.support:    '%env(APP_MAIL_SUPPORT)%'
  app.app_name:        '%env(APP_NAME)%'
  app.login_url:       '%env(APP_LOGIN_URL)%'

  # 📸 Carpeta donde se almacenarán las imágenes subidas de InformacionPersonal
  uploads_directory: '%kernel.project_dir%/public/uploads/imagenes'

  # 🗂️ Carpeta base de subidas (padre de /imagenes y /certificados)
  uploads_base_directory: '%kernel.project_dir%/public/uploads'

  # 🎓 Carpeta donde se almacenarán los certificados académicos
  certificados_directory: '%kernel.project_dir%/public/uploads/certificados'


# -------------------------------
# 🧩 Definición de servicios
# -------------------------------
services:
  # Configuración por defecto de todos los servicios
  _defaults:
    autowire: true       # Symfony inyecta dependencias automáticamente
    autoconfigure: true  # Registra servicios automáticamente (commands, event listeners, etc.)

  # Hace que todas las clases dentro de src/ sean detectadas automáticamente como servicios
  App\:
    resource: '../src/'

  # =====================================================
  # SERVICIO: WelcomeMailer (envío de correo al crear usuarios)
  # =====================================================
  App\Service\WelcomeMailer:
    arguments:
      $fromEmail: '%app.mail.from_email%'
      $fromName:  '%app.mail.from_name%'
      $soporteEmail: '%app.mail.support%'
      $appName: '%app.app_name%'
      $loginUrl: '%app.login_url%'

  # =====================================================
  # SERVICIO: ActualizacionMailer (envío de correo al actualizar usuarios)
  # =====================================================
  App\Service\ActualizacionMailer:
    arguments:
      $fromEmail: '%app.mail.from_email%'
      $fromName:  '%app.mail.from_name%'
      $soporteEmail: '%app.mail.support%'
      $appName: '%app.app_name%'
      $loginUrl: '%app.login_url%'
